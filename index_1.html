<html lang="hi"><head><meta charset="utf-8">

<title>Loan Seva</title>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#000;--mut:#5c5c5c;--pri:#000;--onpri:#fff;--pri2:#efefef;--acc:#000;--line:#d6d6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#121212;--ink:#fff;--mut:#a3a3a3;--pri:#fff;--onpri:#000;--pri2:#1f1f1f;--acc:#fff;--line:#333;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#121212;--ink:#fff;--mut:#a3a3a3;--pri:#fff;--onpri:#000;--pri2:#1f1f1f;--acc:#fff;--line:#333;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Hind,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:0 16px 40px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0}.top b{flex:1;font-size:20px}
.ic{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}
.hero{background:var(--pri);color:var(--onpri);border-radius:18px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 4px;font-size:26px;line-height:1.25}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;text-decoration:none}.tile big{font-size:28px;display:block}
.btn{display:block;width:100%;background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:13px;font:600 17px Hind,sans-serif;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px}
.btn.alt{background:var(--pri2);color:var(--pri)}
label{display:block;margin-top:12px;font-weight:500;font-size:14px;color:var(--mut)}
input,select,textarea{width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:16px Hind,sans-serif}
input[type=range]{padding:0;accent-color:var(--pri)}input[type=checkbox]{width:auto;margin-right:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.seg{display:flex;gap:8px;margin-top:4px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.seg .on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.steps{display:flex;gap:6px;margin-bottom:6px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--acc)}
.tl{list-style:none;padding:0;margin:8px 0 0}.tl li{padding:3px 0 3px 26px;position:relative;color:var(--mut)}.tl li:before{content:'';position:absolute;left:3px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--line)}.tl li.d{color:var(--ink);font-weight:600}.tl li.d:before{background:var(--pri)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
.th{width:72px;height:72px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0;border:1px solid var(--line)}
.sc{font-size:40px;font-weight:700;color:var(--pri)}.muted{color:var(--mut);font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:15px}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;word-break:break-word}
summary{cursor:pointer}.big{font-size:34px;font-weight:700}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:10}#ov img{max-width:95%;max-height:90%}
.ub{display:flex;gap:8px;margin-top:6px;position:relative}.ub label{flex:1;margin:0;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--pri2);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}.ub input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style></head><body><div id="app"></div>
<script>

title:['Loan Seva','लोन सेवा'],tag:['Home, business, personal and more loans in one place','होम, बिज़नेस, पर्सनल और अन्य लोन एक ही जगह'],
mob:['Mobile number','मोबाइल नंबर'],getotp:['Get OTP','OTP पाएं'],otp:['Enter the OTP sent to your mobile','आपके मोबाइल पर आया OTP डालें'],verify:['Verify','वेरिफाई करें'],
demo:['',''],badm:['Enter a valid 10-digit mobile number','सही 10 अंकों का मोबाइल नंबर डालें'],bado:['Wrong OTP','OTP गलत है'],
chl:['Choose your language','अपनी भाषा चुनें'],hi:['Welcome','नमस्ते'],apply:['Apply for a loan','लोन के लिए आवेदन करें'],mylo:['My loan status','मेरे लोन की स्थिति'],
emi:['EMI calculator','EMI कैलकुलेटर'],help:['Contact us and help','संपर्क और सहायता'],chat:['Chat with me','मुझसे चैट करें'],latest:['Your latest application','आपका ताज़ा आवेदन'],
s1:['About you','आपकी जानकारी'],s2:['Loan requirement','लोन की ज़रूरत'],s3:['KYC and CIBIL','KYC और CIBIL'],
name:['Full name','पूरा नाम'],email:['Email ID','ईमेल आईडी'],ltype:['Loan type','लोन का प्रकार'],prof:['Profession','प्रोफ़ेशन'],sal:['Salaried','नौकरीपेशा'],self:['Self-employed','स्वरोज़गार'],
co1:['Company name','कंपनी का नाम'],co2:['Business name','बिज़नेस का नाम'],nat1:['Nature of job (optional)','जॉब का स्वरूप (ज़रूरी नहीं)'],nat2:['Nature of business (optional)','बिज़नेस का स्वरूप (ज़रूरी नहीं)'],
inc:['Monthly income / salary (₹)','मासिक आय / सैलरी (₹)'],haddr:['Home address','घर का पता'],baddr:['Business / office address','बिज़नेस / ऑफिस का पता'],
amt:['Loan amount (₹)','लोन राशि (₹)'],ten:['Tenure (years)','अवधि (साल)'],emia:['EMI you can pay (₹ per month)','आप कितनी EMI दे सकते हैं (₹ प्रति माह)'],
paddr:['Property address','प्रॉपर्टी का पता'],area:['Property area (sq. yard)','प्रॉपर्टी का क्षेत्रफल (वर्ग गज)'],est:['Approx. EMI at 11%','11% पर अनुमानित EMI'],
aad:['Aadhaar number (12 digits)','आधार नंबर (12 अंक)'],pan:['PAN number','पैन नंबर'],i1:['Your photo','आपकी फोटो'],i2:['PAN card photo','पैन कार्ड की फोटो'],i3:['Aadhaar card front','आधार कार्ड (आगे)'],i5:['Aadhaar card back','आधार कार्ड (पीछे)'],i4:['Property papers photo (optional)','प्रॉपर्टी के कागज़ की फोटो (ज़रूरी नहीं)'],gal:['Gallery','गैलरी'],cam:['Camera','कैमरा'],
cib:['CIBIL score','CIBIL स्कोर'],dob:['Date of birth','जन्म तिथि'],cibn:['PAN and date of birth are used only to fetch your CIBIL score.','PAN और जन्म तिथि सिर्फ़ CIBIL स्कोर निकालने के लिए इस्तेमाल होती है।'],getc:['Get my CIBIL score with OTP','OTP से मेरा CIBIL स्कोर निकालें'],cibo:['Enter the OTP sent to your mobile','आपके मोबाइल पर आया OTP डालें'],
cons:['I agree to share my details and CIBIL report with the lender for loan processing.','मैं लोन प्रोसेसिंग के लिए अपनी जानकारी और CIBIL रिपोर्ट साझा करने की सहमति देता/देती हूँ।'],
next:['Next','आगे'],sub:['Submit application','आवेदन जमा करें'],req:['Please fill all required fields','कृपया सभी ज़रूरी जानकारी भरें'],bad:['Please add your photo, PAN card and Aadhaar front and back','अपनी फोटो, पैन कार्ड और आधार के आगे-पीछे की फोटो जोड़ें'],cons2:['Please accept the consent','कृपया सहमति दें'],full:['Storage full, remove some photos','स्टोरेज भर गया है'],
done:['Application submitted','आवेदन जमा हो गया'],donem:['Thank you! Our representative will contact you soon.','धन्यवाद! हमारे प्रतिनिधि जल्द ही आपसे संपर्क करेंगे।'],home:['Back to home','होम पर जाएं'],
noapp:['You have not applied yet.','आपने अभी तक आवेदन नहीं किया है।'],call:['Call','कॉल करें'],mail:['Email','ईमेल'],helpm:['Questions about your loan? Talk to me directly.','लोन के बारे में कोई सवाल? सीधे मुझसे बात करें।'],
rate:['Interest rate (% per year)','ब्याज दर (% सालाना)'],emires:['Monthly EMI','मासिक EMI'],tint:['Total interest','कुल ब्याज'],ttl:['Total payment','कुल भुगतान'],
owner:['Owner login','मालिक लॉगिन'],pin:['Enter PIN','PIN डालें'],badp:['Wrong PIN','PIN गलत है'],leads:['Customer applications','ग्राहक आवेदन'],stat:['Status','स्थिति'],none:['No applications yet.','अभी कोई आवेदन नहीं।'],
ph:['Mobile','मोबाइल'],ap:['Applied on','आवेदन तिथि'],exit:['Exit','बाहर']};

const ST=[['Received','प्राप्त हुआ'],['In review','जाँच जारी'],['Documents verified','दस्तावेज़ वेरिफाई'],['Approved','स्वीकृत'],['Disbursed','राशि जारी'],['Rejected','अस्वीकृत']];
const PROP=[0,1,4,5];
const Q=[['A small EMI today builds a big dream tomorrow.','आज की छोटी EMI, कल का बड़ा सपना।'],['The right loan is not the biggest one, it is the one you can repay comfortably.','सही लोन वही है जिसे आप आराम से चुका सकें, सबसे बड़ा लोन नहीं।'],['Pay your EMI on time and your CIBIL score will thank you.','EMI समय पर भरें, आपका CIBIL स्कोर खुद बढ़ेगा।'],['Your own home starts with a single application.','अपना घर एक आवेदन से शुरू होता है।'],['Borrow with a plan, repay with confidence.','योजना से लोन लें, भरोसे से चुकाएं।']];
const qi=Math.floor(Math.random()*Q.length);
let L=ls('lang','hi'),M=ls('user',''),V=M&&ls('tk','')?(nm()?'home':'nm'):'login',F={},step=1,cibS=0,A=false,TK=ls('tk',''),AT='',LEADS=null,MY=null;
const $=s=>document.querySelector(s),li=()=>L==='hi'?1:0,t=k=>T[k]?T[k][li()]:k;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
const wa=()=>`https://wa.me/91${OWN.phone}?text=${encodeURIComponent('Hello, I need a loan')}`;
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function go(v){V=v;render()}
function tl(){L=L==='hi'?'en':'hi';sv('lang',L);document.documentElement.lang=L;render(1)}
function head(ti,bk){return `<div class=top>${bk?`<button class=ic onclick="${bk}">←</button>`:''}<b>${ti}</b><button class=ic onclick=tl()>${L==='hi'?'EN':'हिं'}</button></div>`}
async function api(a,d){if(API.startsWith('PASTE')){toast('Backend URL not set');return null}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,d:d||{},tk:A?AT:TK})});const j=await r.json().catch(()=>({error:'Server replied HTTP '+r.status}));if(!r.ok||j.error){if(j.error==='AUTH'&&!A){TK='';sv('tk','');MY=null;go('login')}else toast(j.error||'Error');return null}return j}catch(e){toast('Network error: '+((e&&e.message)||e));return null}}
async function refreshMy(){const r=await api('my_leads');if(r){MY=r.leads;if(V==='home'||V==='stat')render(1)}}
function goStat(){MY=null;go('stat')}
async function adminLogin(){const r=await api('admin_login',{password:$('#pn').value});if(!r)return;AT=r.token;A=true;LEADS=null;go('admin');const x=await api('admin_leads');if(x){LEADS=x.leads;render(1)}}
async function sendOtp(){const m=$('#m').value.trim();if(!/^[6-9]\d{9}$/.test(m))return toast(t('badm'));M=m;const r=await api('send_otp',{mobile:m});if(r)go('otp')}
async function verify(){const r=await api('verify_otp',{mobile:M,code:$('#o').value.trim()});if(!r)return;TK=r.token;sv('tk',TK);sv('user',M);MY=null;go('lang')}
function setLang(l){L=l;sv('lang',l);document.documentElement.lang=l;go(nm()?'home':'nm')}
function nm(){return ls('names',{})[M]||''}
function saveName(){const n=$('#nn').value.trim();if(n.length<2)return toast(t('req'));const o=ls('names',{});o[M]=n;sv('names',o);go('home')}
function startApp(){F={type:'0',prof:'s',img:{},name:nm()};step=1;cibS=0;go('form')}
function inp(k,l,ty,ex){return `<label>${l}<input type=${ty||'text'} ${ex||''} value="${esc(F[k])}" oninput="F['${k}']=this.value;hint()"></label>`}
function ta(k,l){return `<label>${l}<textarea rows=2 oninput="F['${k}']=this.value">${esc(F[k])}</textarea></label>`}
function up(k){return `<label>${t(k)}</label><div class=ub><label for=g_${k}>📁 ${t('gal')}</label><input type=file id=g_${k} accept="image/*" onchange="pick(this,'${k}')"><label for=c_${k}>📷 ${t('cam')}</label><input type=file id=c_${k} accept="image/*" capture=${k==='i1'?'user':'environment'} onchange="pick(this,'${k}')"></div><div id="p_${k}">${F.img[k]?`<img class=th src="${F.img[k]}">`:''}</div>`}
function pick(el,k){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);F.img[k]=c.toDataURL('image/jpeg',.55);$('#p_'+k).innerHTML=`<img class=th src="${F.img[k]}">`};im.onerror=()=>toast('⚠️');im.src=r.result};r.readAsDataURL(f);el.value=''}
function emiOf(P,R,Y){const r=R/1200,n=Y*12;return r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n}
function hint(){const h=$('#hint');if(h)h.textContent=(+F.amt&&+F.ten)?t('est')+': '+fmt(emiOf(+F.amt,11,+F.ten)):''}
function nxt(){
 if(step===1){const ok=F.name&&F.email&&F.inc&&F.haddr&&F.co;if(!ok)return toast(t('req'))}
 if(step===2){const ok=+F.amt&&+F.ten&&+F.emi&&(!PROP.includes(+F.type)||(F.paddr&&F.area));if(!ok)return toast(t('req'))}
 step++;render()}
async function cibGo(){if(!F.cn)return toast(t('cons2'));const pan=(F.pan||'').toUpperCase();if(!/^[A-Z]{5}\d{4}[A-Z]$/.test(pan)||!F.dob)return toast(t('req'));const r=await api('cibil_start',{pan,dob:F.dob,name:F.name,consent:true});if(!r)return;if(r.score){F.cibil=r.score;cibS=2}else cibS=1;render(1)}

 if(!F.img.i1||!F.img.i2||!F.img.i3||!F.img.i5)return toast(t('bad'));
 if(!F.cn)return toast(t('cons2'));

 $('#res').innerHTML=`<div>${t('emires')}</div><div class=big>${fmt(e)}</div><div>${t('tint')}: ${fmt(e*n-P)}</div><div>${t('ttl')}: ${fmt(e*n)}</div>`}

 return head(t('leads')+' ('+a.length+')',"A=false;AT='';go('login')")+(a.length?a.map(x=>{const s=x.prof==='s',p=PROP.includes(+x.type);return `<details class=card><summary><b>${esc(x.name)}</b> · ${LT[x.type][li()]} · ${fmt(x.amt)}<br><span class=muted>${ST[x.st][li()]} · ${x.mob}</span></summary>

 <label>${t('stat')}<select onchange="setSt('${x.id}',this.value)">${ST.map((z,i)=>`<option value=${i} ${i==x.st?'selected':''}>${z[li()]}</option>`).join('')}</select></label>

login:()=>head('')+`<div class=hero><h1>${t('title')}</h1><div>${t('tag')}</div></div><label>${t('mob')}<input id=m type=tel maxlength=10 inputmode=numeric placeholder="98XXXXXXXX"></label><button class=btn onclick=sendOtp()>${t('getotp')}</button><p class=muted>${t('demo')}</p><button class="btn alt" onclick="go('alogin')">${t('owner')}</button>`,
otp:()=>head(t('otp'),"go('login')")+`<p class=muted>+91 ${M}</p><label><input id=o type=tel maxlength=6 inputmode=numeric></label><button class=btn onclick=verify()>${t('verify')}</button><p class=muted>${t('demo')}</p>`,
lang:()=>`<div class=top><b>${t('chl')}</b></div><button class=btn onclick="setLang('hi')">हिन्दी</button><button class="btn alt" onclick="setLang('en')">English</button>`,
nm:()=>head('')+`<div class=hero><h1>${t('hi')}!</h1></div><label>${t('name')}<input id=nn type=text></label><button class=btn onclick=saveName()>${t('next')}</button>`,
alogin:()=>head(t('owner'),"go('login')")+`<label>${t('pin')}<input id=pn type=password></label><button class=btn onclick=adminLogin()>${t('verify')}</button>`,
admin:()=>chk()||VW.login(),
home:()=>{const a=(MY||[])[0];return head('')+`<div class=hero><h1>${t('hi')}!</h1><div>${esc(nm())}</div></div>
<button class=btn style="margin:0 0 12px" onclick=startApp()>${t('apply')}</button>
${a?`<div class=card><span class=muted>${t('latest')}</span><br><b>${LT[a.type][li()]} · ${fmt(a.amt)}</b> — ${ST[a.st][li()]}</div>`:''}
<div class=grid style="margin-top:12px"><button class=tile onclick="goStat()"><big>📋</big>${t('mylo')}</button><button class=tile onclick="go('calc')"><big>🧮</big>${t('emi')}</button><button class=tile onclick="go('help')"><big>☎️</big>${t('help')}</button><a class=tile href="${wa()}" target=_blank><big>💬</big>${t('chat')}</a></div>
<div class=card style="margin-top:24px;padding:22px;text-align:center"><div style="font-size:28px">💡</div><div style="font-size:21px;font-weight:600;line-height:1.4;margin-top:6px">“${Q[qi][li()]}”</div></div>`},
form:()=>{const P=PROP.includes(+F.type),s=F.prof==='s';let h=head(t('s'+step),step>1?'step--;render()':"go('home')")+`<div class=steps>${[1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
 if(step===1)h+=`<label>${t('ltype')}<select onchange="F.type=this.value">${LT.map((x,i)=>`<option value=${i} ${F.type==i?'selected':''}>${x[li()]}</option>`).join('')}</select></label>
 ${inp('name',t('name'))}${inp('email',t('email'),'email')}<label>${t('prof')}</label><div class=seg><button class="${s?'on':''}" onclick="F.prof='s';render(1)">${t('sal')}</button><button class="${s?'':'on'}" onclick="F.prof='b';render(1)">${t('self')}</button></div>
 ${inp('co',t(s?'co1':'co2'))}${inp('nat',t(s?'nat1':'nat2'))}${inp('inc',t('inc'),'number','inputmode=numeric')}${ta('haddr',t('haddr'))}${ta('baddr',t('baddr'))}`;
 if(step===2)h+=`${inp('amt',t('amt'),'number','inputmode=numeric')}${inp('ten',t('ten'),'number','inputmode=numeric')}${inp('emi',t('emia'),'number','inputmode=numeric')}${P?ta('paddr',t('paddr'))+inp('area',t('area'),'number','inputmode=decimal'):''}`;
 if(step===3)h+=`${up('i1')}${up('i2')}${up('i3')}${up('i5')}${P?up('i4'):''}
 <label style="display:flex"><input type=checkbox id=cn ${F.cn?'checked':''} onchange="F.cn=this.checked">${t('cons')}</label>
 <div class=card><b>${t('cib')}</b>${cibS===0?`<p class=muted>${t('cibn')}</p>${inp('pan',t('pan'),'text','maxlength=10 style="text-transform:uppercase"')}${inp('dob',t('dob'),'date')}<button class="btn alt" onclick=cibGo()>${t('getc')}</button>`:cibS===1?`<p class=muted>${t('cibo')}</p><input id=c1 type=tel maxlength=6 inputmode=numeric><button class=btn onclick=cibOk()>${t('verify')}</button>`:`<div class=sc>${F.cibil}</div>`}</div>
 <button class=btn onclick=submit()>${t('sub')}</button>`;
 if(step<3)h+=`<button class=btn onclick=nxt()>${t('next')}</button>`;return h},
done:()=>`<div class=hero style="margin-top:30px"><h1>✓ ${t('done')}</h1><div>${t('donem')}</div></div><button class=btn onclick="goStat()">${t('mylo')}</button><button class="btn alt" onclick="go('home')">${t('home')}</button>`,
stat:()=>{const a=MY||[];return head(t('mylo'),"go('home')")+(MY===null?'<div class=card>…</div>':a.length?a.map(x=>`<div class=card><b>${LT[x.type][li()]} · ${fmt(x.amt)}</b><div class=muted>${x.ref} · ${new Date(x.at).toLocaleDateString('en-IN')}</div>${x.st>4?`<p><b>${ST[5][li()]}</b></p>`:`<ul class=tl>${ST.slice(0,5).map((z,i)=>`<li class="${i<=x.st?'d':''}">${z[li()]}</li>`).join('')}</ul>`}</div>`).join(''):`<div class=card>${t('noapp')}</div><button class=btn onclick=startApp()>${t('apply')}</button>`)},
calc:()=>head(t('emi'),"go('home')")+`<div class=card>${sl('a',t('amt'),100000,10000000,50000,2500000)}${sl('r',t('rate'),6,24,.1,10.5)}${sl('y',t('ten'),1,30,1,15)}</div><div class=hero style="margin-top:12px" id=res></div>`,
help:()=>head(t('help'),"go('home')")+`<div class=card><div class=big style="font-size:24px">${OWN.name}</div><div class=muted>${OWN.biz}</div><p>${t('helpm')}</p><a class=btn href="tel:${OWN.phone}">📞 ${t('call')} ${OWN.phone}</a><a class="btn alt" href="${wa()}" target=_blank>💬 ${t('chat')}</a><a class="btn alt" href="mailto:${OWN.email}">✉️ ${t('mail')}</a></div>`};
function render(k){if(!k)window.scrollTo(0,0);if((V==='home'||V==='stat')&&MY===null&&TK)refreshMy();$('#app').innerHTML=VW[V]();if(V==='calc')calc2();if(V==='form')hint()}
render();
</script></body></html>
